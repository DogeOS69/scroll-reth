[package]
name = "reth-rpc-traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "RPC conversion traits for Ethereum types."

[lints]
workspace = true

[dependencies]
# reth
reth-primitives-traits.workspace = true

# ethereum
alloy-consensus.workspace = true
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-signer.workspace = true

# scroll
scroll-alloy-consensus = { workspace = true, default-features = false, optional = true }
scroll-alloy-rpc-types = { workspace = true, default-features = false, optional = true }

# misc
thiserror.workspace = true

[features]
default = ["std"]
std = [
    "alloy-consensus/std",
    "alloy-primitives/std",
    "alloy-rpc-types-eth/std",
    "reth-primitives-traits/std",
    "scroll-alloy-consensus?/std",
    "scroll-alloy-rpc-types?/std",
    "thiserror/std",
]
scroll = [
    "dep:scroll-alloy-consensus",
    "dep:scroll-alloy-rpc-types",
]
